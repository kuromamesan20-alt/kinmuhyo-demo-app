# シフト区分の定義(参照用)。
# 実際の定義は src/shift_scheduler/shifts.py にあり、コードはそちらを見ています。
# 時間や必要人数が変わったときは shifts.py を直してください。

日勤帯:
  日①: "06:00-14:00"
  日②: "07:00-15:00"
  日③: "08:00-16:00"
  日:   "09:00-17:00"   # 番号なし。人数の決まりなし(実物は1日平均5.1人)
  日⑤: "11:00-19:00"
  日⑦: "13:00-21:00"
  日⑨: "12:30-20:30"
  # ④⑥⑧ は使っていない

夜間:
  夜勤: "○(入り) → △(明け) → 公(公休) の3日セット"
  深夜: "◉(入り) → 公(公休) の2日セット"

毎日の必要人数:
  日①: 1
  日②: 1
  日③: 1
  日⑤: 1
  日⑦: 1
  日⑨: 1
  ○: 2   # 夜勤の入り(実物は31日中26日が2人、5日が3人)
  ◉: 1   # 深夜の入り
  # 「日」は毎日必須ではない。上記が全部埋まった後、まだ出られる人がいれば付ける枠。

備考:
  - 「日」は人数の決まりが無く、残りの勤務者が入る枠。実物で最も多く使われている。
  - 責任者「せ」: 師長が出勤している日は師長が担うので記載しない。
    師長が休みの日だけ、日勤責任者が「可」の人を1人「せ」にする。
  - パート職員など決まった時間だけ出る人は、番号を使わず「9-15」のように時間をそのまま書く。
  - CSVの「早出」「遅出」列には時間が書かれていないため、
    早出=日①・日②、遅出=日⑤・日⑦・日⑨ を指すものとして扱う。
    (両方とも不可のパート職員が「日③」と「日」に残るようにするため)
    ただし条件文に時間の記載がある人は、そちらを正とする。
